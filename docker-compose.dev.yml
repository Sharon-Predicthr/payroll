# Development docker-compose - uses volumes for hot reload

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payroll-sqlserver-dev
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - payroll-network

  # Backend API (development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: payroll-backend-dev
    environment:
      - NODE_ENV=development
      - CONTROL_DB_URL=Server=sqlserver;Database=PayrollControlDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - JWT_SECRET=dev-secret-key-change-in-production
      - PORT=4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - sqlserver
    networks:
      - payroll-network
    command: npm run start:dev

  # Frontend (development mode with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: payroll-frontend-dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - payroll-network
    command: npm run dev

volumes:
  sqlserver-data:
    driver: local

networks:
  payroll-network:
    driver: bridge

